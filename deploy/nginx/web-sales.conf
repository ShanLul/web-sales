# web-sales Nginx 站点配置（单域名 + 路径前缀方案）
#
# 安装位置：
#   sudo cp deploy/nginx/web-sales.conf /etc/nginx/conf.d/web-sales.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# 路径约定（与后端 .env 的 PUBLIC_BASE_URL 必须一致）：
#   /            -> 主系统后台静态产物（frontend-admin/dist）
#   /portal/     -> 子系统 H5 静态产物（frontend-portal/dist，构建时 VITE_BASE=/portal/）
#   /api/        -> 反向代理到本机 Uvicorn（127.0.0.1:8000）
#
# 因此 PUBLIC_BASE_URL 应写 https://your-domain.com/portal
# 后端拼出的链接形如 https://your-domain.com/portal/#/order?t=xxxx
# 子系统用 hash 路由，Nginx 无需任何 try_files 之外的 rewrite 规则。
#
# 隐藏服务器 IP（源站防护）：Cloudflare 橙云代理 + 防火墙只放行 Cloudflare 回源，
# 详见 deploy/DEPLOY.md 5.2。配套脚本：
#   deploy/nginx/cloudflare-ips.sh        真实客户端 IP 还原
#   deploy/cloudflare-firewall.sh         让源站只接受 Cloudflare 回源

upstream web_sales_api {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name your-domain.com;
    # 上线后建议用 certbot 换 443，并把 80 段改成 return 301 https://$host$request_uri;

    charset utf-8;
    client_max_body_size 4m;

    # ---------- 真实客户端 IP 还原（接入 Cloudflare 代理后启用） ----------
    # 作用：橙云代理后，到达源站的请求对端全是 Cloudflare 的 IP，
    #       这里用 CF-Connecting-IP 把 $remote_addr 还原成真实客户端，日志与排查才可信。
    #
    # 启用步骤（详见 deploy/DEPLOY.md 5.2）：
    #   1. 域名在 Cloudflare 开启代理（橙云），确认网站仍可正常访问；
    #   2. sudo bash deploy/nginx/cloudflare-ips.sh   生成下面的片段；
    #   3. 取消注释，sudo nginx -t && sudo systemctl reload nginx。
    #
    # 注意：本文件里**不要**用 allow/deny 写「只放行 Cloudflare」的白名单。
    #       real_ip 已经把 $remote_addr 换成了真实客户 IP，白名单会匹配不上，
    #       结果是把 CF 回源的正常请求全部 403。
    #       「只允许 Cloudflare 回源」请交给防火墙：sudo bash deploy/cloudflare-firewall.sh
    #
    # include /etc/nginx/cloudflare-realip.conf;

    access_log /var/log/nginx/web-sales.access.log;
    error_log  /var/log/nginx/web-sales.error.log warn;

    # ---------- 后端接口 ----------
    location /api/ {
        proxy_pass http://web_sales_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Excel 导出为大文件流式回传，放宽超时但不要让连接长期挂着
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering on;
    }

    # 不带尾斜杠的 /portal 不会命中下面的前缀 location，会掉进主系统站点，
    # 这里显式重定向，避免用户手输地址时打开错误的应用
    location = /portal {
        return 301 /portal/;
    }

    # ---------- 子系统 H5（注意：不要加 /portal 的 rewrite，产物自身带 base） ----------
    location /portal/ {
        alias /var/www/web-sales/portal/;
        index index.html;
        try_files $uri $uri/ /portal/index.html;
    }

    # ---------- 主系统后台 ----------
    location / {
        root /var/www/web-sales/admin;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # ---------- 静态资源缓存 ----------
    # Vite 产物文件名带内容 hash，可以放心长缓存；入口 HTML 单独禁缓存。
    # 这里用两条精确前缀的正则 location，避免在 location 内写 if（易出错）。
    # 注意这里用 root 而非 alias：URI 自带 /portal 前缀，拼接后正好落在 portal 目录
    location ~* ^/portal/assets/.+\.(js|css|woff2?|ttf|svg|png|jpg|jpeg|webp|ico)$ {
        root /var/www/web-sales;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* ^/assets/.+\.(js|css|woff2?|ttf|svg|png|jpg|jpeg|webp|ico)$ {
        root /var/www/web-sales/admin;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 入口 HTML 绝不缓存，保证发版后用户拿到新资源引用
    location = /index.html {
        root /var/www/web-sales/admin;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /portal/index.html {
        alias /var/www/web-sales/portal/index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_vary on;
}

# ============================================================================
# 备选方案：两个独立域名分别托管（与上方二选一，不要同时启用）
#
# server {
#     listen 80;
#     server_name admin.your-domain.com;
#     root /var/www/web-sales/admin;
#     index index.html;
#     location / { try_files $uri $uri/ /index.html; }
#     location /api/ { proxy_pass http://web_sales_api; proxy_set_header Host $host; }
# }
#
# server {
#     listen 80;
#     server_name portal.your-domain.com;
#     root /var/www/web-sales/portal;
#     index index.html;
#     location / { try_files $uri $uri/ /index.html; }
#     location /api/ { proxy_pass http://web_sales_api; proxy_set_header Host $host; }
# }
#
# 此时子系统构建 VITE_BASE 保持默认 /，
# 并把 .env 的 PUBLIC_BASE_URL 设为 https://portal.your-domain.com
#
# 源站防护注意：real_ip 还原片段两个 server 块都要各 include 一份（都用橙云时）；
#               而「只放行 Cloudflare 回源」由 deploy/cloudflare-firewall.sh 统一处理，
#               与 server 块数量无关。两个域名都必须开橙云，否则未开启的那个直连会被防火墙拦掉。
# ============================================================================
