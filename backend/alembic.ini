[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# NOTE: keep this file ASCII-only. Alembic's configparser reads it with the
# system locale encoding, which breaks on Windows/GBK and on LANG=C servers.
# The real database url is injected in alembic/env.py from app.core.config.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
